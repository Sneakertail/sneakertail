services:
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  postgres:
    image: postgres:14-alpine
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: devpassword
      POSTGRES_DB: sneakerdb
    ports:
      - "5432:5432"

  auth-service:
    build: ./auth-service
    ports:
      - "3001:3001"
    environment:
      # Local seeded users for docker-compose:
      # admin / admin12345
      # user / user12345
      - DB_HOST=postgres
      - DB_USER=admin
      - DB_PASSWORD=devpassword
      - DB_NAME=sneakerdb
      - PORT=3001
      - JWT_SECRET=secretkey
      - ADMIN_USERNAME=admin
      - ADMIN_EMAIL=admin@sneakertail.com
      - ADMIN_PASSWORD=admin12345
      - DEMO_USERNAME=user
      - DEMO_EMAIL=user@sneakertail.com
      - DEMO_PASSWORD=user12345
    depends_on:
      - postgres

  product-service:
    build: ./product-service
    ports:
      - "3002:3002"
    environment:
      - DB_HOST=postgres
      - DB_USER=admin
      - DB_PASSWORD=devpassword
      - DB_NAME=sneakerdb
      - PORT=3002
    depends_on:
      - postgres

  raffle-service:
    build: ./raffle-service
    ports:
      - "3003:3003"
    environment:
      - REDIS_URL=redis://redis:6379
      - PORT=3003
    depends_on:
      - redis

  interaction-service:
    build: ./interaction-service
    ports:
      - "3004:3004"
    environment:
      - DB_HOST=postgres
      - DB_USER=admin
      - DB_PASSWORD=devpassword
      - DB_NAME=sneakerdb
      - PORT=3004
    depends_on:
      - postgres

  payment-service:
    build: ./payment-service
    ports:
      - "3005:3005"
    environment:
      - PORT=3005

  frontend:
    build:
      context: ./frontend
      args:
        REACT_APP_AUTH_API: "http://localhost:3001/api/auth"
        REACT_APP_PRODUCT_API: "http://localhost:3002/api/products"
        REACT_APP_RAFFLE_API: "http://localhost:3003/api/raffle"
        REACT_APP_INTERACTION_API: "http://localhost:3004/api"
        REACT_APP_PAYMENT_API: "http://localhost:3005/api/payment"
    ports:
      - "8080:80"
